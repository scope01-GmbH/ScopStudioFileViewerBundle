scop-file-viewer.tree.create-error: '"{{name}}" konnte nicht erstellt werden.'

# Editor
scop-file-viewer.editor.empty-state: Wählen Sie eine Datei im Baum aus, um sie zu öffnen.
scop-file-viewer.editor.nothing-to-show: Nichts anzuzeigen.
scop-file-viewer.editor.download: Herunterladen
scop-file-viewer.editor.save: Speichern
