# Studio UI-Übersetzungen für das Scop Studio File Viewer Bundle.
#
# Nur flache Punktnotation - verschachteltes YAML wird vom Studio-Translator nicht aufgelöst.
# Englisch ist die Basissprache; fehlende Schlüssel fallen auf Englisch zurück.

